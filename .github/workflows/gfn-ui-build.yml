name: GFN UI build (linux-x64)

# Slim build for the GFN-style UI fork: Linux x64 only, GitHub-hosted runner,
# no signing or packaging. Produces the installed usr/ tree as an artifact so the
# kiosk can swap in the rebuilt Cloudlight binary next to its existing runtime.

on:
  push:
    branches: [main, gfn-ui]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Publish a release with this version, like 1.1.0 (leave empty for a normal build)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: gfn-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      SDL_VERSION: release-3.2.20
      OPENNOW_BUILD_VERSION: 1.0.2-nightly.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Use the release version for release builds
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "OPENNOW_BUILD_VERSION=${version#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools qtwaylandcompositor
          cache: true
          cache-key-prefix: gfnui-qt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libasound2-dev libdbus-1-dev libdrm-dev \
            libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-good1.0-0 libpulse-dev \
            libsecret-1-dev libva-dev libvulkan-dev libwayland-dev libx11-dev libxcursor-dev \
            libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev libxss-dev \
            make nasm pkg-config wayland-protocols ccache

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gfnui-linux-x64
          cache-on-failure: true
          workspaces: |
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Cache C++ compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639
        with:
          key: gfnui-linux-x64
          max-size: 1G

      - name: Build and cache SDL3
        uses: ./.github/actions/sdl3
        with:
          version: ${{ env.SDL_VERSION }}
          target-arch: x64
          parallel: 4

      - name: Configure
        run: |
          cmake -S opennow-qt -B build/opennow-qt-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENNOW_BUILD_VERSION="$OPENNOW_BUILD_VERSION" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install"

      - name: Build
        run: cmake --build build/opennow-qt-release --config Release --parallel 4

      - name: Capture UI screenshots
        run: |
          sudo apt-get install -y xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1 fonts-noto-color-emoji \
            mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
          mkdir -p build/screens
          app=$(find build/opennow-qt-release -maxdepth 3 -type f -name cloudlight -perm -u+x | head -1)
          bash scripts/capture-gfn-ui.sh "$app" build/screens | tee build/screens/summary.txt || true

      - name: Run the Qt test suite
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir build/opennow-qt-release -C Release \
            --output-on-failure --parallel 4 --timeout 300 --no-tests=error -LE interactive-desktop \
            > build/screens/ctest.log 2>&1
          echo "ctest exit $?" >> build/screens/ctest.log
          grep -E "tests passed|tests failed|\*\*\*Failed|\*\*\*Timeout|Not Run|ctest exit" build/screens/ctest.log \
            > build/screens/ctest-summary.txt
          cat build/screens/ctest-summary.txt
          true

      - name: Publish screenshots to the screens branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cd build/screens
          git init -q -b screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screens for ${GITHUB_SHA::8} (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens:screens

      - name: Lint QML
        continue-on-error: true
        run: |
          find opennow-qt/qml -name '*.qml' -print0 | \
            xargs -0 "$QT_ROOT_DIR/bin/qmllint" --max-warnings -1 2>&1 | tail -200 || true

      - name: Install tree
        run: |
          cmake --install build/opennow-qt-release --config Release --prefix "$PWD/build/AppDir/usr"
          ls -la build/AppDir/usr/bin

      - uses: actions/upload-artifact@v4
        with:
          name: opennow-gfnui-linux-x64
          path: build/AppDir/usr/bin
          retention-days: 14

  windows-x64:
    # Same QML UI on Windows, built the way upstream qt-build.yml does it but on
    # a GitHub-hosted runner. Produces the portable ZIP only (no MSI/WiX).
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      SDL_VERSION: release-3.2.20
      OPENNOW_BUILD_VERSION: 1.0.2-nightly.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Use the release version for release builds
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "OPENNOW_BUILD_VERSION=${version#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Enable Windows Media Foundation
        shell: pwsh
        run: .github/scripts/ensure-windows-media-foundation.ps1

      - name: Map stable Windows workspace
        shell: pwsh
        run: .github/scripts/map-windows-workspace.ps1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bound Rust compilation
        shell: pwsh
        run: |
          "CARGO_BUILD_JOBS=4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $linker = Join-Path $env:VCToolsInstallDir "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $linker)) { throw "The MSVC x64 linker is unavailable." }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "libclang.dll"))) { throw "LLVM installation is missing libclang.dll" }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia qtshadertools
          cache: true
          cache-key-prefix: gfnui-qt-windows

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: gfnui-windows-x64
          cache-bin: false
          cache-on-failure: true
          workspaces: |
            native/opennow-core -> ../../build/opennow-qt-release/rust-target
            native/opennow-core -> ../../build/opennow-qt-release/update-helper-rust-target
            native/opennow-streamer -> ../../build/opennow-qt-release/streamer-rust-target

      - name: Cache C++ compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639
        with:
          key: gfnui-windows-x64
          max-size: 1G

      - name: Build and cache SDL3
        uses: ./.github/actions/sdl3
        with:
          version: ${{ env.SDL_VERSION }}
          target-arch: x64
          parallel: 4

      - name: Configure
        shell: bash
        run: |
          cd /o
          cmake -S opennow-qt -B build/opennow-qt-release \
            -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENNOW_BUILD_VERSION="$OPENNOW_BUILD_VERSION" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL-install"

      - name: Build
        shell: bash
        run: |
          cd /o
          cmake --build build/opennow-qt-release --config Release --parallel 4

      - name: Capture Windows UI screenshots
        shell: pwsh
        continue-on-error: true
        run: |
          Set-Location "O:\"
          $app = Get-ChildItem -Recurse -Filter Cloudlight.exe build/opennow-qt-release | Select-Object -First 1
          New-Item -ItemType Directory -Force build/screens-windows | Out-Null
          $out = (Resolve-Path build/screens-windows).Path
          $env:PATH = "$env:QT_ROOT_DIR\bin;$($app.DirectoryName);$env:PATH"
          $captures = @(
            @{ name = "home"; args = @("--desktop", "--route", "home", "--smoke-paper-design") },
            @{ name = "library"; args = @("--desktop", "--route", "library", "--smoke-collections") },
            @{ name = "signin"; args = @("--desktop", "--smoke-paper-design", "--smoke-alliance-routing") },
            @{ name = "signin-light"; args = @("--desktop", "--smoke-alliance-routing") },
            @{ name = "settings-stream"; args = @("--desktop", "--route", "settings", "--smoke-paper-design", "--smoke-settings-page", "stream") },
            @{ name = "settings-network"; args = @("--desktop", "--route", "settings", "--smoke-paper-design", "--smoke-settings-page", "network") },
            @{ name = "settings-appearance"; args = @("--desktop", "--route", "settings", "--smoke-paper-design", "--smoke-settings-page", "appearance") },
            @{ name = "settings-experimental"; args = @("--desktop", "--route", "settings", "--smoke-paper-design", "--smoke-settings-page", "experimental") },
            @{ name = "console-home"; args = @("--console", "--route", "home", "--smoke-paper-design") },
            @{ name = "console-library"; args = @("--console", "--route", "library", "--smoke-paper-design") },
            @{ name = "console-settings"; args = @("--console", "--route", "settings", "--smoke-paper-design") },
            @{ name = "console-signin"; args = @("--console", "--smoke-paper-design", "--smoke-alliance-routing") },
            @{ name = "console-home-light"; args = @("--console", "--route", "home") },
            @{ name = "stream-stats"; args = @("--desktop", "--route", "stream", "--smoke-stream-stats", "--smoke-stats-expanded") },
            @{ name = "stream-menu"; args = @("--desktop", "--route", "stream", "--overlay", "desktop-stream-menu", "--smoke-stream-stats") }
          )
          foreach ($capture in $captures) {
            $png = Join-Path $out "$($capture.name).png"
            $log = Join-Path $out "$($capture.name).log"
            $arguments = @("--smoke-test", "--allow-multiple-instances", "--reduced-motion",
              "--smoke-width", "1600", "--smoke-height", "900", "--screenshot", $png) + $capture.args
            $process = Start-Process -FilePath $app.FullName -ArgumentList $arguments -PassThru -NoNewWindow `
              -RedirectStandardError $log -RedirectStandardOutput "$log.out"
            if (-not $process.WaitForExit(90000)) { $process.Kill() }
            "$($capture.name): exit $($process.ExitCode) png=$(Test-Path $png)" | Tee-Object -Append (Join-Path $out summary.txt)
          }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Publish Windows screenshots
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        continue-on-error: true
        run: |
          cd /o/build/screens-windows
          git init -q -b screens-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows screens for ${GITHUB_SHA::8} (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens-windows:screens-windows

      - name: Package portable ZIP
        shell: bash
        run: |
          cd /o
          mkdir -p build/qt-packages
          cpack --config build/opennow-qt-release/CPackConfig.cmake -C Release -G ZIP -B build/qt-packages
          ls -la build/qt-packages

      - uses: actions/upload-artifact@v4
        with:
          name: opennow-gfnui-windows-x64
          path: build/qt-packages/*.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    needs: [windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opennow-gfnui-windows-x64
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${version#v}"
          tag="v${version}"
          zip=$(ls dist/*.zip | head -n1)
          mv "$zip" "dist/Cloudlight-${version}-windows-x64.zip"
          (cd dist && sha256sum "Cloudlight-${version}-windows-x64.zip" > "Cloudlight-${version}-windows-x64.zip.sha256")
          gh release create "$tag" dist/Cloudlight-* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cloudlight ${version}" \
            --notes-file ".github/release-notes/${tag}.md" --latest
