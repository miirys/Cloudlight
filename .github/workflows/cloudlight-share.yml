name: Cloudlight TV (share a build)

# Puts a finished build's APK on Litterbox and prints the link, for when the Actions artifact
# page can't be used (it needs a GitHub login and hands out a zip). The link lasts three days.
# To share another build, put its run number in .github/cloudlight-share-run and push.
on:
  push:
    paths:
      - '.github/cloudlight-share-run'
      - '.github/workflows/cloudlight-share.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run of "Cloudlight TV (Android)" whose APK to share'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  share:
    name: Upload the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pick the build
        id: pick
        env:
          ASKED: ${{ inputs.run_id }}
        run: |
          run=$(printf '%s' "${ASKED:-$(cat .github/cloudlight-share-run)}" | tr -dc '0-9')
          test -n "$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: cloudlight-tv-apk
          path: apk
          run-id: ${{ steps.pick.outputs.run }}
          github-token: ${{ github.token }}

      - name: Upload to Litterbox
        # temp.sh was tried first and answers 500 to any file of 20 MB or more.
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' tv/app/build.gradle.kts)
          apk="Cloudlight-$version.apk"
          cp apk/*.apk "$apk"
          ls -l "$apk"
          sha256sum "$apk"
          code=$(curl -sS --retry 2 --retry-delay 5 -m 600 -o reply.txt -w '%{http_code}' \
            -F reqtype=fileupload -F time=72h -F "fileToUpload=@$apk" \
            https://litterbox.catbox.moe/resources/internals/api.php || true)
          echo "Litterbox: HTTP $code"; head -c 300 reply.txt; echo
          link=$(grep -Eo 'https://[^[:space:]"<]+\.apk' reply.txt | head -1 || true)
          if [ "$code" != "200" ] || [ -z "$link" ]; then
            echo "Litterbox did not take the file"
            exit 1
          fi
          echo "Download link: $link"
          echo "Download link: $link" >> "$GITHUB_STEP_SUMMARY"
