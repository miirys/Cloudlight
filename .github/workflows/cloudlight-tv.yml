name: Cloudlight TV (Android)

on:
  push:
    paths:
      - 'tv/**'
      - '.github/workflows/cloudlight-tv.yml'
  pull_request:
    paths:
      - 'tv/**'
      - '.github/workflows/cloudlight-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudlight-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Generate decoder test clips
        run: ./probe/make-clips.sh

      # The 4K mode streams over NVIDIA's native protocol, which lives in a Rust library
      # (tv/nvst). It is built here for both ARM ABIs and packaged like any other .so.
      - name: Install the NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Add the Android Rust targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Cache the native library build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tv/nvst/target
          key: nvst-${{ runner.os }}-${{ hashFiles('tv/nvst/Cargo.lock', 'tv/nvst/**/*.rs', 'tv/nvst/**/Cargo.toml', 'tv/scripts/build_nvst.py') }}
          restore-keys: nvst-${{ runner.os }}-

      - name: Build the native streaming library
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMAKE="$sdk/cmake/3.22.1/bin/cmake" python3 scripts/build_nvst.py "$sdk/ndk/27.2.12479018" app/src/main/jniLibs
          ls -l app/src/main/jniLibs/*/

      - name: Build APKs
        # Retried once: dependency servers sometimes rate-limit shared runners.
        run: |
          ./gradlew --no-daemon :app:assembleRelease :probe:assembleRelease || {
            sleep 60
            ./gradlew --no-daemon :app:assembleRelease :probe:assembleRelease
          }

      - name: Upload Cloudlight APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudlight-tv-apk
          path: tv/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudlight-probe-apk
          path: tv/probe/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # Only commits that ask for it with "[release]" in their message become a release.
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: cloudlight-tv-apk
          path: apk

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' tv/app/build.gradle.kts)
          cp apk/*.apk "Cloudlight-$version.apk"
          gh release create "v$version" "Cloudlight-$version.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cloudlight $version" --notes-file tv/RELEASE_NOTES.md
