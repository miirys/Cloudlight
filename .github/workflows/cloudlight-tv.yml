name: Cloudlight TV (Android)

on:
  push:
    paths:
      - 'tv/**'
      - '.github/workflows/cloudlight-tv.yml'
  pull_request:
    paths:
      - 'tv/**'
      - '.github/workflows/cloudlight-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudlight-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tv
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Generate decoder test clips
        run: ./probe/make-clips.sh

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleRelease :probe:assembleRelease

      - name: Upload Cloudlight APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudlight-tv-apk
          path: tv/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudlight-probe-apk
          path: tv/probe/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
